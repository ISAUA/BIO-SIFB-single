# ==========================================
# Bio-SFINet (Spatial-Frequency Network) 配置
# 适用数据: MISAR-seq (E18)
# ==========================================

project:
  name: "SF_MISAR_E18_Analysis"        # 项目名称，用于记录
  version: "1.0.0"                     # 版本号
  seed: 42                              # 随机种子
  save_dir: "./results/misar_e18/checkpoints/"   # 模型 checkpoint 保存目录
  eval_dir: "./results/misar_e18/predictions/"   # 评估输出目录

eval:                                   # 评估相关设置
  checkpoint: "best"                   # 默认使用哪个检查点（key 名，可在 checkpoints 映射中定义）
  checkpoints:                          # key->文件名映射，可自由扩展
    best: "ckpt_best.pth"
    final: "ckpt_300.pth"

# ------------------------------------------
# 1. 数据路径与预处理参数
# ------------------------------------------
data:
  raw_path: "data/raw/misar_e18"           # 原始数据目录
  processed_path: "data/processed/misar_e18"  # 预处理输出目录

  files:                                # 原始文件名定义（MISAR-seq: h5 + csv）
    h5_matrix: "E18_5-S1_raw_feature_bc_matrix.h5"
    spatial_csv: "SPARC_barcode.csv"
    gtf: "gencode.vM23.annotation.gtf.gz"

  parameters:                           # 预处理超参数
    n_top_genes: 3000                   # RNA 高变基因数量
    rna_min_cells: 3                    # 基因至少出现在多少细胞中
    rna_target_sum: 1e4                 # RNA 归一化目标总和
    n_global_peaks: 50000               # ATAC 初筛峰数量
    n_final_peaks: 30000                # ATAC 最终保留峰数量
    atac_min_cells: 50                  # 峰至少出现在多少细胞中
    atac_target_sum: 1e4                # ATAC 归一化目标总和
    tfidf_eps: 1e-6                     # TF-IDF 平滑项
    tss_window: 150000                  # TSS 上下游窗口大小 (bp)
    knn_k: 6                           # 构图的 k 近邻
    ground_truth_key: "Combined_Clusters"  # 评估用真实标签列名（来自 h5ad.obs）

# ------------------------------------------
# 2. 模型架构参数
# ------------------------------------------
model:
  name: "SFNet"                        # 模型名称
  rna_in_dim: 3000                      # RNA 输入维度（高变基因数）
  hidden_dim: 512                       # 编码器隐藏维度
  rna_n_heads: 4                        # RNA GAT 头数
  rna_dropout: 0.1                      # RNA 编码器 dropout
  atac_dropout: 0.1                     # ATAC 编码器 dropout
  n_heads: 4                            # 备用头数（保持一致）
  dropout: 0.1                          # 通用 dropout
  grid_size: 128                        # 网格大小（如有使用）
  latent_dim: 50                        # 潜变量维度（如有使用）
  sfib_dim: 128                         # SFIB 特征维度
  sfib_ino_layers: 4                    # SFIB 中 INO 单元层数
  proj_hidden_dim: 64                   # 对比投影头隐藏维度
  proj_output_dim: 64                   # 对比投影头输出维度
  rna_dec_hidden: 512                   # RNA 解码器隐藏维度
  rna_dec_blocks: 1                     # RNA 解码器残差块数
  atac_dec_hidden: 512                  # ATAC 解码器隐藏维度
  atac_dec_blocks: 1                    # ATAC 解码器残差块数
  sfib_debug_mode: false                 # 是否启用 SFIB 调试模式（输出中间特征）
  model.sfib_debug_epochs: [1, 10, 20]  # sfib_debug_epochs: [1, 10, 50, 100, 200, 500, 1000]  # SFIB 调试模式输出的特定训练轮次
  model.sfib_debug_every_n_epochs: 20   # SFIB 调试模式每隔多少轮输出一次（如果 sfib_debug_epochs 为空则启用）

# ------------------------------------------
# 3. 训练策略参数
# ------------------------------------------
train:
  epochs: 1600                          # 训练轮数
  batch_size: 1                         # 批大小（当前实现按全量）
  learning_rate: 1e-3                   # 学习率（前 1000 轮）
  learning_rate_low: 1e-4               # 学习率（后 600 轮）
  lr_switch_epoch: 1000                  # 学习率切换轮次
  weight_decay: 1e-4                    # 权重衰减
  lambda_rna: 5.0                       # RNA 重构损失权重
  lambda_atac: 1.0                      # ATAC 重构损失权重
  lambda_clip: 0.5                      # 对比损失权重
  fade_start_epoch: 800                 # CLIP 权重退火起始轮次
  fade_end_epoch: 1200                  # CLIP 权重退火结束轮次
  pos_weight_rna: 10.0                  # RNA 重构正样本权重
  pos_weight_atac: 20.0                 # ATAC 重构正样本权重
  clip_temperature: 0.5                 # 对比损失温度
  save_every: 50                        # 周期性保存间隔
  device: "cuda"                       # 设备
  log_interval: 10                      # 日志打印间隔（轮）
  best_name: "ckpt_best.pth"           # 最优模型文件名
