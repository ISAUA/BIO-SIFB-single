project:
  name: SF_MISAR_E18_Analysis
  version: 1.0.0
  seed: 42
  save_dir: ./results/misar_e18/checkpoints/
  eval_dir: ./results/misar_e18/predictions/
eval:
  checkpoint: best
  checkpoints:
    best: ckpt_best.pth
    final: ckpt_300.pth
data:
  raw_path: data/raw/misar_e18
  processed_path: data/processed/misar_e18
  files:
    h5_matrix: E18_5-S1_raw_feature_bc_matrix.h5
    spatial_csv: SPARC_barcode.csv
    gtf: gencode.vM23.annotation.gtf.gz
  parameters:
    n_top_genes: 3000
    rna_min_cells: 3
    rna_target_sum: 1e4
    n_global_peaks: 50000
    n_final_peaks: 30000
    atac_min_cells: 50
    atac_target_sum: 1e4
    tfidf_eps: 1e-6
    tss_window: 150000
    knn_k: 6
model:
  name: SFNet
  rna_in_dim: 3000
  hidden_dim: 512
  rna_n_heads: 4
  rna_dropout: 0.1
  atac_dropout: 0.1
  n_heads: 4
  dropout: 0.1
  grid_size: 128
  latent_dim: 50
  sfib_dim: 128
  sfib_ino_layers: 3
  proj_hidden_dim: 64
  proj_output_dim: 64
  rna_dec_hidden: 512
  rna_dec_blocks: 1
  atac_dec_hidden: 512
  atac_dec_blocks: 1
  sfib_debug_mode: true
  sfib_debug_epochs: []
  sfib_debug_every_n_epochs: 1
train:
  epochs: 1600
  batch_size: 1
  learning_rate: 1e-3
  learning_rate_low: 1e-4
  lr_switch_epoch: 1000
  weight_decay: 1e-4
  lambda_rna: 5.0
  lambda_atac: 1.0
  lambda_clip: 0.5
  fade_start_epoch: 800
  fade_end_epoch: 1200
  pos_weight_rna: 10.0
  pos_weight_atac: 20.0
  clip_temperature: 0.5
  save_every: 50
  device: cuda
  log_interval: 10
  best_name: ckpt_best.pth
