# ==========================================
# Bio-SFINet (Spatial-Frequency Network) 配置
# 适用数据: Mouse (P22)
# ==========================================

project:                              # 项目级配置
  name: "SF_Mouse_Analysis"          # 项目名称
  version: "1.0.0"                   # 配置版本
  seed: 42                            # 随机种子
  save_dir: "./results/mouse/checkpoints/"   # 训练 checkpoint 输出目录
  eval_dir: "./results/mouse/predictions/"   # 评估输出目录

eval:                                 # 评估配置
  checkpoint: "best"                 # 默认评估 checkpoint key
  n_clusters: 14                      # mclust 聚类簇数（点位数）
  mclust_pca_dim: 20                  # mclust 前 PCA 维度
  resolution: 0.9                     # Leiden 分辨率（mclust失败回退时使用）
  moran_k: 6                          # Moran's I 邻居数
  checkpoints:                        # checkpoint 映射表
    best: "ckpt_best.pth"            # 最优 checkpoint 文件名
    final: "ckpt_200.pth"            # 最终/指定轮次 checkpoint 文件名

data:                                 # 数据配置
  raw_path: "data/raw/mouse"          # 原始数据目录
  processed_path: "data/processed/mouse"  # 预处理输出目录

  files:                              # 原始文件名定义
    rna_mtx: "P22.mtx"               # RNA 矩阵文件
    rna_genes: "genes.tsv"           # RNA 基因名文件
    rna_barcodes: "gene_barcodes.tsv" # RNA 细胞条码文件

    atac_mtx: "P22_atac.mtx"         # ATAC 矩阵文件
    atac_peaks: "peaks.tsv"          # ATAC 峰文件
    atac_barcodes: "atac_barcodes.tsv" # ATAC 细胞条码文件

    spatial: "position.tsv"          # 空间坐标文件
    gtf: "gencode.vM23.annotation.gtf.gz" # GTF 注释文件

  parameters:                         # 预处理超参数
    n_top_genes: 3000                 # RNA 高变基因数
    rna_min_cells: 3                  # RNA 基因最小细胞数过滤
    rna_target_sum: 1e4               # RNA 归一化目标总和
    n_global_peaks: 50000             # ATAC 初筛峰数
    n_final_peaks: 30000              # ATAC 最终保留峰数
    atac_min_cells: 100               # ATAC 峰最小细胞数过滤
    atac_target_sum: 1e4              # ATAC 归一化目标总和
    tfidf_eps: 1e-6                   # TF-IDF 平滑项
    tss_window: 150000                # TSS 上下游窗口(bp)
    knn_k: 6                          # 空间图 k 近邻

model:                                # 模型结构配置
  name: "SFNet"                      # 模型名称
  rna_in_dim: 3000                    # RNA 输入维度
  hidden_dim: 512                     # 主干隐藏维度
  rna_n_heads: 4                      # RNA 分支注意力头数
  rna_dropout: 0.1                    # RNA 分支 dropout
  atac_dropout: 0.1                   # ATAC 分支 dropout
  n_heads: 4                          # 通用注意力头数
  dropout: 0.1                        # 通用 dropout
  grid_size: 128                      # 网格大小
  latent_dim: 50                      # 潜变量维度
  sfib_dim: 128                       # SFIB 特征维度
  sfib_ino_layers: 3                  # SFIB INO 层数
  proj_hidden_dim: 64                 # 对比投影头隐藏维度
  proj_output_dim: 64                 # 对比投影头输出维度
  rna_dec_hidden: 512                 # RNA 解码器隐藏维度
  rna_dec_blocks: 1                   # RNA 解码器残差块数
  atac_dec_hidden: 512                # ATAC 解码器隐藏维度
  atac_dec_blocks: 1                  # ATAC 解码器残差块数

train:                                # 训练配置
  epochs: 1000                        # 训练轮数
  batch_size: 1                       # 批大小（当前实现按全量）
  learning_rate: 1e-3                 # 初始学习率
  learning_rate_low: 1e-4             # 低学习率阶段学习率
  lr_switch_epoch: 800                # 学习率切换轮次
  weight_decay: 1e-4                  # 权重衰减
  lambda_rna: 5.0                     # RNA 重构损失权重
  lambda_atac: 1.0                    # ATAC 重构损失权重
  lambda_clip: 0.5                    # 对比损失权重
  fade_start_epoch: 500               # CLIP 权重退火起始轮次
  fade_end_epoch: 900                 # CLIP 权重退火结束轮次
  pos_weight_rna: 10.0                # RNA 正样本加权
  pos_weight_atac: 20.0               # ATAC 正样本加权
  clip_temperature: 0.5               # CLIP 温度参数
  save_every: 50                      # checkpoint 保存间隔
  device: "cuda"                     # 训练设备
  log_interval: 10                    # 日志打印间隔
  best_name: "ckpt_best.pth"         # 最优模型文件名
